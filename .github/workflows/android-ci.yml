name: Android CI

on:
  push:
    branches: [ '**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # ubuntu-latest ships the Android SDK (ANDROID_SDK_ROOT). Do NOT use
      # android-actions/setup-android here: it tries to install the removed
      # legacy 'tools' package and fails with "Failed to find package 'tools'".
      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          fi
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

      - name: Show toolchain versions
        run: |
          java -version
          ./gradlew --version

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests
          if-no-files-found: ignore

      - name: Build debug and release APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Name APKs after the version
        id: name
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then LABEL="${GITHUB_REF_NAME}"; else LABEL="${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}"; fi
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/DrawAnywhere-${LABEL}-release.apk"
          cp app/build/outputs/apk/debug/*.apk   "dist/DrawAnywhere-${LABEL}-debug.apk"
          ls -la dist
          echo "label=${LABEL}" >> "$GITHUB_OUTPUT"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: drawanywhere-release-apk
          path: dist/*-release.apk
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: drawanywhere-debug-apk
          path: dist/*-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: DrawAnywhere ${{ steps.name.outputs.label }}
          files: |
            dist/*-release.apk
            dist/*-debug.apk
          generate_release_notes: true
